<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Budgetle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Devinez le pays européen derrière un budget public. Six essais, données Eurostat 2024.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Mise en page : une colonne de lecture (68ch) façon fiche de comptes publics ; le treemap est le seul objet « plein cadre ». */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --ink: #14171c; --ink-2: #4a505a; --ink-3: #6b7280;
  --rule: #d9dde3; --accent: #1c5cab; --accent-soft: #e4edf8; --warn: #8a5a00; --warn-soft: #fbf1dc;
  --ok: #1b7a4a;
  --gf01: #6250d6; --gf02: #e34948; --gf03: #e87ba4; --gf04: #eb6834; --gf05: #008300;
  --gf06: #8a8f98; --gf07: #1baf7a; --gf08: #a39a8c; --gf09: #eda100;
  --sp1: #104281; --sp2: #184f95; --sp3: #256abf; --sp4: #2a78d6; --sp5: #3987e5; --sp6: #5598e7; --sp7: #6da7ec;
  --f-display: "Young Serif", Georgia, "Times New Roman", serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121417; --surface: #1b1e23; --ink: #eef0f3; --ink-2: #b8bec8; --ink-3: #8f96a1;
  --rule: #2e333b; --accent: #7fb0ee; --accent-soft: #1d2a3b; --warn: #f0c063; --warn-soft: #2e2512; --ok: #5fcf93;
  --gf01: #9085e9; --gf02: #e66767; --gf03: #d55181; --gf04: #d95926; --gf05: #2f9a2f;
  --gf06: #767c86; --gf07: #199e70; --gf08: #8f8778; --gf09: #c98500;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121417; --surface: #1b1e23; --ink: #eef0f3; --ink-2: #b8bec8; --ink-3: #8f96a1;
  --rule: #2e333b; --accent: #7fb0ee; --accent-soft: #1d2a3b; --warn: #f0c063; --warn-soft: #2e2512; --ok: #5fcf93;
  --gf01: #9085e9; --gf02: #e66767; --gf03: #d55181; --gf04: #d95926; --gf05: #2f9a2f;
  --gf06: #767c86; --gf07: #199e70; --gf08: #8f8778; --gf09: #c98500;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 1rem/1.6 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 4rem; }
.wrap { max-width: 68rem; margin: 0 auto; }
.col { max-width: 44rem; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; text-wrap: balance; line-height: 1.15; margin: 0; }
h1 { font-size: clamp(2.2rem, 6vw, 3.4rem); letter-spacing: -0.01em; }
h2 { font-size: 1.7rem; }
h3 { font-size: 1.2rem; }
p { margin: 0; }
a { color: var(--accent); }
.eyebrow { font: 500 .75rem/1 var(--f-data); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.num { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
section { display: grid; gap: 1.1rem; padding-block: 2.6rem; border-top: 1px solid var(--rule); }
header.top { display: grid; gap: .9rem; padding-block: 2.4rem 2rem; }
.lede { font-size: 1.12rem; color: var(--ink-2); max-width: 40rem; }
.status { display: inline-flex; gap: .5rem; flex-wrap: wrap; }
.pill { font: 500 .78rem/1 var(--f-data); padding: .4rem .6rem; border-radius: 999px; border: 1px solid var(--rule); color: var(--ink-2); background: var(--surface); }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }

/* Carte du pays mystère */
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 1.1rem; display: grid; gap: .9rem; min-width: 0; }
.headline { display: flex; align-items: baseline; gap: .7rem; flex-wrap: wrap; }
.headline .big { font: 400 clamp(2.4rem, 8vw, 3.6rem)/1 var(--f-display); }
.headline .unit { color: var(--ink-2); }
.tm { position: relative; width: 100%; aspect-ratio: 16 / 10; max-width: 100%; background: var(--surface); }
@media (max-width: 560px) { .tm { aspect-ratio: 1 / 1.05; } }
.tile { position: absolute; overflow: hidden; border-radius: 3px; padding: .35rem .45rem; display: flex; flex-direction: column; gap: .1rem;
  font-size: .8rem; line-height: 1.2; cursor: pointer; outline-offset: -3px; }
.tile:focus-visible, .tile.on { outline: 3px solid var(--ink); }
.tile b { font-weight: 700; }
.tile .v { font-family: var(--f-data); font-size: .74rem; font-variant-numeric: tabular-nums; opacity: .92; }
.tile.sp { border-radius: 1px; }
.group-ring { position: absolute; border: 2px solid var(--ink); border-radius: 4px; pointer-events: none; opacity: .55; }
.detail { min-height: 4.6rem; border-top: 1px solid var(--rule); padding-top: .7rem; display: grid; gap: .2rem; }
.detail .k { font-weight: 700; }
.detail .row { display: flex; gap: 1.2rem; flex-wrap: wrap; color: var(--ink-2); }
.legend-note { font-size: .85rem; color: var(--ink-3); }

/* Essais */
.guesses { display: grid; gap: .4rem; }
.g { display: grid; grid-template-columns: minmax(0, 1fr) 6.2rem 2.4rem 4rem; gap: .5rem; align-items: center;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: .55rem .7rem; }
.g.head { background: transparent; border: 0; padding-block: 0; }
.g .c { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.g.head .c, .g.head span { font-weight: 400; }
.g.win { border-color: var(--ok); }
.arrow { width: 1.4rem; height: 1.4rem; display: block; margin: auto; color: var(--ink); }
.r { text-align: right; }
.squares { font-size: 1.1rem; letter-spacing: .1rem; }

.rules { display: grid; gap: .9rem; counter-reset: r; padding: 0; margin: 0; list-style: none; }
.rules li { display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: .6rem; }
.rules li::before { counter-increment: r; content: counter(r); font: 400 1.3rem/1.3 var(--f-display); color: var(--accent); }

.tabs { display: flex; gap: .4rem; flex-wrap: wrap; }
.tab { font: 700 .9rem/1 var(--f-body); padding: .6rem .85rem; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab:focus-visible, select:focus-visible, summary:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.note { background: var(--accent-soft); border-radius: 8px; padding: .8rem 1rem; font-size: .95rem; }
.note.warn { background: var(--warn-soft); }
.tag { font: 500 .7rem/1 var(--f-data); letter-spacing: .06em; text-transform: uppercase; padding: .2rem .4rem; border-radius: 4px; margin-right: .35rem; vertical-align: .1em; background: var(--surface); color: var(--ink-2); border: 1px solid var(--rule); }

.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 19rem), 1fr)); gap: 1rem; }
.facts { display: grid; gap: .55rem; margin: 0; }
.facts div { display: grid; grid-template-columns: 9rem minmax(0, 1fr); gap: .8rem; }
.facts dt { color: var(--ink-3); font-size: .9rem; }
.facts dd { margin: 0; min-width: 0; }
@media (max-width: 480px) { .facts div { grid-template-columns: 1fr; gap: 0; } }

details { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
summary { cursor: pointer; padding: .6rem .8rem; font-weight: 700; }
.tbl { overflow-x: auto; padding: 0 .8rem .8rem; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid var(--rule); white-space: nowrap; }
td.n, th.n { text-align: right; font-family: var(--f-data); font-variant-numeric: tabular-nums; }
tr.sub td:first-child { padding-left: 1.4rem; color: var(--ink-2); }
select { font: inherit; padding: .5rem .6rem; border-radius: 8px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); max-width: 100%; }
.open { display: grid; gap: .8rem; }
.open > div { border-left: 3px solid var(--warn); padding-left: .9rem; }
.small { font-size: .88rem; color: var(--ink-2); }
button.reveal { font: 700 .9rem/1 var(--f-body); padding: .6rem .9rem; border-radius: 8px; border: 1px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; justify-self: start; }
@media (prefers-reduced-motion: no-preference) { .tile { transition: outline-color .15s; } }

/* Page de jeu : une seule colonne étroite, pensée d'abord pour le téléphone. */
.game { max-width: 40rem; margin: 0 auto; display: grid; gap: 1rem; padding-top: 1rem; }
.bar { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; padding-bottom: .6rem; border-bottom: 1px solid var(--rule); }
.bar h1 { font-size: 2rem; }
.bar nav { display: flex; gap: 1rem; font-size: .95rem; }
.slots { display: grid; gap: .4rem; }
.g.empty { background: transparent; border-style: dashed; min-height: 2.6rem; }
form.play { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .5rem; position: relative; }
form.play input { font: inherit; font-size: 1.05rem; padding: .7rem .8rem; border-radius: 8px; border: 1px solid var(--ink-3); background: var(--surface); color: var(--ink); min-width: 0; }
form.play input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
form.play button { font: 700 1rem/1 var(--f-body); padding: .7rem 1.1rem; border-radius: 8px; border: 0; background: var(--ink); color: var(--bg); cursor: pointer; }
form.play button:disabled { opacity: .5; cursor: default; }
.sugg { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 5; list-style: none; margin: 0; padding: .3rem; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 8px 24px rgb(0 0 0 / .12); }
.sugg li { padding: .55rem .6rem; border-radius: 6px; cursor: pointer; }
.sugg li[aria-selected="true"], .sugg li:hover { background: var(--accent-soft); }
.msg { min-height: 1.4rem; font-size: .92rem; color: var(--warn); }
.end { display: grid; gap: .8rem; }
.end h2 { font-size: 1.6rem; }
.end ul { margin: 0; padding-left: 1.1rem; display: grid; gap: .35rem; }
.share { display: grid; gap: .5rem; }
.share textarea { font: .95rem/1.4 var(--f-data); padding: .6rem; border-radius: 8px; border: 1px solid var(--rule); background: var(--bg); color: var(--ink); resize: none; width: 100%; }
.share button, .end a.btn { justify-self: start; font: 700 .95rem/1 var(--f-body); padding: .65rem 1rem; border-radius: 8px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); cursor: pointer; text-decoration: none; }
.banner { font-size: .88rem; background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: .5rem .8rem; }
</style>
</head>
<body>


<div class="game">
  <div class="bar">
    <h1>Budgetle</h1>
    <nav><span class="num small" id="num"></span><a href="regles.html">Règles et données</a></nav>
  </div>
  <p class="banner" id="banner" hidden></p>
  <div class="card" id="mystery"></div>
  <div class="slots" id="slots" aria-live="polite"></div>
  <form class="play" id="form" autocomplete="off">
    <input id="guess" type="text" placeholder="Nom d'un pays européen" aria-label="Votre proposition" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sugg" enterkeyhint="go" autocapitalize="words" spellcheck="false">
    <button type="submit" id="go">Valider</button>
    <ul class="sugg" id="sugg" role="listbox" hidden></ul>
  </form>
  <p class="msg" id="msg" role="status"></p>
  <div class="card end" id="end" hidden></div>
  <p class="small">Données : Eurostat, dépenses des administrations publiques par fonction, 2024 (© Union européenne). Distance et direction calculées comme dans Tradle.</p>
</div>

<script>
// Règles géographiques du jeu — reprise fidèle de Tradle (licence MIT, src/domain/geography.ts)
// Distance : loi sphérique des cosinus, rayon 6 378 137 m, comme geolib.getDistance (v3).
// Direction : cap loxodromique (geolib.getRhumbLineBearing), arrondi aux 8 points cardinaux.
// Ces fonctions sont vérifiées contre geolib par scripts/04_simulate.mjs.

const EARTH_RADIUS_M = 6378137;
const rad = (d) => (d * Math.PI) / 180;
const deg = (r) => (r * 180) / Math.PI;

function distanceMeters(a, b) {
  const x = Math.sin(rad(b.lat)) * Math.sin(rad(a.lat)) +
    Math.cos(rad(b.lat)) * Math.cos(rad(a.lat)) * Math.cos(rad(a.lon) - rad(b.lon));
  return Math.round(Math.acos(Math.min(1, Math.max(-1, x))) * EARTH_RADIUS_M);
}

function rhumbBearing(from, to) {
  let dLon = rad(to.lon) - rad(from.lon);
  const dPhi = Math.log(Math.tan(rad(to.lat) / 2 + Math.PI / 4) / Math.tan(rad(from.lat) / 2 + Math.PI / 4));
  if (Math.abs(dLon) > Math.PI) dLon = dLon > 0 ? -(2 * Math.PI - dLon) : 2 * Math.PI + dLon;
  return (deg(Math.atan2(dLon, dPhi)) + 360) % 360;
}

const DIRS = ["N", "NE", "E", "SE", "S", "SW", "W", "NW", "N"];
/** Direction à suivre depuis le pays proposé vers le pays mystère. */
function compassDirection(guess, target) {
  return DIRS[Math.round(rhumbBearing(guess, target) / 45)];
}

/** Proximité Tradle : 100 % − distance / 20 000 km, plafonnée à 99 % si ce n'est pas la bonne réponse. */
function proximityTradle(distanceM, maxM = 20_000_000) {
  const p = Math.round((Math.max(maxM - distanceM, 0) / maxM) * 100);
  return distanceM > 0 && p >= 100 ? 99 : p;
}

/** Variante « échelle européenne » : même formule, rapportée à la plus grande distance du jeu. */
function proximityScaled(distanceM, maxM) {
  return proximityTradle(distanceM, maxM);
}

/** Carrés de partage Tradle : un vert par tranche de 20 %, un jaune si le reste ≥ 10. */
function squares(p) {
  const g = Math.floor(p / 20), y = p - g * 20 >= 10 ? 1 : 0;
  return "🟩".repeat(g) + "🟨".repeat(y) + "⬜".repeat(5 - g - y);
}

// Treemap « squarifié » (Bruls, Huizing & van Wijk, 2000), sans dépendance.
// Entrée : items [{value, ...}] (valeurs > 0), rectangle {x, y, w, h}.
// Sortie : mêmes items avec {x, y, w, h}, surfaces strictement proportionnelles aux valeurs.

function squarify(items, rect) {
  const data = items.filter((d) => d.value > 0).sort((a, b) => b.value - a.value);
  const total = data.reduce((s, d) => s + d.value, 0);
  const scale = (rect.w * rect.h) / total;
  const nodes = data.map((d) => ({ ...d, area: d.value * scale }));
  const out = [];
  let { x, y, w, h } = rect;
  let row = [];

  const worst = (r, side) => {
    const s = r.reduce((a, n) => a + n.area, 0);
    let max = -Infinity, min = Infinity;
    for (const n of r) { max = Math.max(max, n.area); min = Math.min(min, n.area); }
    return Math.max((side * side * max) / (s * s), (s * s) / (side * side * min));
  };

  const layoutRow = (r) => {
    const s = r.reduce((a, n) => a + n.area, 0);
    if (w >= h) { // colonne à gauche
      const cw = s / h; let cy = y;
      for (const n of r) { const nh = n.area / cw; out.push({ ...n, x, y: cy, w: cw, h: nh }); cy += nh; }
      x += cw; w -= cw;
    } else { // ligne en haut
      const rh = s / w; let cx = x;
      for (const n of r) { const nw = n.area / rh; out.push({ ...n, x: cx, y, w: nw, h: rh }); cx += nw; }
      y += rh; h -= rh;
    }
  };

  for (const n of nodes) {
    const side = Math.min(w, h);
    if (row.length === 0 || worst([...row, n], side) <= worst(row, side)) row.push(n);
    else { layoutRow(row); row = [n]; }
  }
  if (row.length) layoutRow(row);
  return out;
}

// Logique de partie de Budgetle — fonctions pures, sans accès à la page (testées par scripts/07_test_game.mjs).

const MAX_TRIES = 6;

// Autres noms acceptés à la saisie (anglais et variantes usuelles)
const ALIASES = {
  AT: ["Austria"], BE: ["Belgium"], BG: ["Bulgaria"], CH: ["Switzerland", "Confédération suisse"],
  CY: ["Cyprus"], CZ: ["République tchèque", "Czechia", "Czech Republic"], DE: ["Germany"],
  DK: ["Denmark"], EE: ["Estonia"], EL: ["Greece", "Hellade"], ES: ["Spain"], FI: ["Finland"],
  FR: [], HR: ["Croatia"], HU: ["Hungary"], IE: ["Ireland", "Eire"], IS: ["Iceland"], IT: ["Italy"],
  LT: ["Lithuania"], LU: [], LV: ["Latvia"], MT: ["Malta"], NL: ["Netherlands", "Hollande"],
  NO: ["Norway"], PL: ["Poland"], PT: [], RO: ["Romania"], SE: ["Sweden"], SI: ["Slovenia"], SK: ["Slovakia"],
};

function normalize(s) {
  return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z]/g, "");
}

function buildIndex(profiles) {
  const idx = new Map();
  for (const p of profiles) for (const n of [p.nom, p.geo, ...(ALIASES[p.geo] || [])]) idx.set(normalize(n), p.geo);
  return idx;
}

function findCountry(input, idx) {
  return idx.get(normalize(input)) ?? null;
}

/** Suggestions : noms français commençant par la saisie, puis ceux qui la contiennent ; hors pays déjà proposés. */
function suggest(input, profiles, exclude = []) {
  const q = normalize(input);
  if (!q) return [];
  const pool = profiles.filter((p) => !exclude.includes(p.geo));
  const names = (p) => [p.nom, ...(ALIASES[p.geo] || [])].map(normalize);
  const starts = pool.filter((p) => names(p).some((n) => n.startsWith(q)));
  const contains = pool.filter((p) => !starts.includes(p) && names(p).some((n) => n.includes(q)));
  return [...starts, ...contains].sort((a, b) => starts.includes(b) - starts.includes(a) || a.nom.localeCompare(b.nom, "fr")).slice(0, 6);
}

/** Date locale du joueur au format AAAA-MM-JJ (comme Tradle : le jour change à minuit chez le joueur). */
function localDay(d = new Date()) {
  const z = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`;
}

/** Numéro de partie (1 = date de début) ; null avant le début ou après la fin du calendrier. */
function dayNumber(day, calendar) {
  const ms = Date.UTC(...day.split("-").map((x, i) => +x - (i === 1 ? 1 : 0))) -
    Date.UTC(...calendar.debut.split("-").map((x, i) => +x - (i === 1 ? 1 : 0)));
  const n = Math.round(ms / 86400000) + 1;
  return n >= 1 && n <= calendar.pays.length ? n : null;
}

function evaluate(guess, target, dmax) {
  const distance = distanceMeters(guess, target);
  return {
    geo: guess.geo,
    distance,
    direction: distance === 0 ? null : compassDirection(guess, target),
    proximity: distance === 0 ? 100 : proximityScaled(distance, dmax),
  };
}

function status(guesses) {
  if (guesses.some((g) => g.distance === 0)) return "won";
  return guesses.length >= MAX_TRIES ? "lost" : "playing";
}

const ARROWS = { N: "⬆️", NE: "↗️", E: "➡️", SE: "↘️", S: "⬇️", SW: "↙️", W: "⬅️", NW: "↖️" };
function shareText(n, guesses, url) {
  const st = status(guesses);
  const lines = guesses.map((g) => squares(g.proximity) + (g.distance === 0 ? "🎉" : ARROWS[g.direction]));
  return [`#Budgetle #${n} ${st === "won" ? guesses.length : "X"}/${MAX_TRIES}`, ...lines, url].filter(Boolean).join("\n");
}

/** Rangs d'une fonction parmi tous les pays, selon sa part dans la dépense publique totale
 *  (comparable même quand le PIB est atypique, comme en Irlande) : high = 1 pour la part la plus forte,
 *  low = 1 pour la plus faible, avec le nombre d'ex aequo (parts arrondies au dixième de point). */
function rankOf(code, geo, profiles) {
  const val = (p) => Math.round(1000 * p.divisions.find((d) => d.code === code).part_du_total) / 10;
  const me = val(profiles.find((p) => p.geo === geo));
  return {
    value: me,
    high: 1 + profiles.filter((p) => val(p) > me).length,
    low: 1 + profiles.filter((p) => val(p) < me).length,
    ties: profiles.filter((p) => p.geo !== geo && val(p) === me).length,
  };
}

const fmt1 = (v) => v.toLocaleString("fr-FR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const ord = (r) => (r === 1 ? "" : `${r}ᵉ `);
const tie = (r) => (r.ties ? `, à égalité avec ${r.ties} autre${r.ties > 1 ? "s" : ""} pays` : "");
const TOP = 5;

/** Faits vérifiables pour l'écran de fin : la fonction où la part du pays est la plus forte
 *  (relativement aux autres pays) et celle où elle est la plus faible, si elles sont dans le top 5. */
function facts(geo, profiles) {
  const n = profiles.length;
  const p = profiles.find((x) => x.geo === geo);
  const r = p.divisions.map((d) => ({ d, ...rankOf(d.code, geo, profiles) }));
  const hi = [...r].sort((a, b) => a.high - b.high || b.value - a.value)[0];
  const lo = r.filter((x) => x !== hi).sort((a, b) => a.low - b.low || a.value - b.value)[0];
  const out = [];
  if (hi.high <= TOP) out.push(`${hi.d.label} : ${fmt1(hi.value)} % de la dépense publique, la ${ord(hi.high)}part la plus forte des ${n} pays${tie(hi)}.`);
  if (lo.low <= TOP) out.push(`${lo.d.label} : ${fmt1(lo.value)} % de la dépense publique, la ${ord(lo.low)}part la plus faible des ${n} pays${tie(lo)}.`);
  return out;
}

const COLORS = { GF01:"--gf01", GF02:"--gf02", GF03:"--gf03", GF04:"--gf04", GF05:"--gf05", GF06:"--gf06", GF07:"--gf07", GF08:"--gf08", GF09:"--gf09",

const fr1 = new Intl.NumberFormat("fr-FR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fr0 = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 0 });
const pct = (v, approx) => v == null ? "n.d." : `${approx ? "≈ " : ""}${fr1.format(v)} % du PIB`;
function money(mio) {
  if (mio == null) return "n.d.";
  if (mio >= 100000) return `${fr0.format(mio / 1000)} Md€`;
  if (mio >= 1000) return `${fr1.format(mio / 1000)} Md€`;
  return `${fr0.format(mio)} M€`;
}
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function inkFor(hex) {
  const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(x => { x /= 255; return x <= .04045 ? x / 12.92 : ((x + .055) / 1.055) ** 2.4; });
  const L = .2126 * c[0] + .7152 * c[1] + .0722 * c[2];
  return L > .23 ? "#111317" : "#ffffff";
}

function drawTreemap(box, p, detailEl) {
  box.innerHTML = "";
  const W = box.clientWidth, H = box.clientHeight;
  if (!W || !H) return;
  const divs = p.divisions.map(d => ({ ...d, value: d.mio_eur }));
  const top = squarify(divs, { x: 0, y: 0, w: W, h: H });
  const GAP = 1;
  const tiles = [];
  for (const r of top) {
    if (r.code === "GF10") {
      const kids = r.detail.filter(k => k.mio_eur > 0).map(k => ({ ...k, value: k.mio_eur, pc: k.pc_gdp_somme_publiee, approx: k.cofog.length > 1, sp: true }));
      for (const k of squarify(kids, { x: r.x, y: r.y, w: r.w, h: r.h })) tiles.push(k);
      const ring = document.createElement("div"); ring.className = "group-ring";
      Object.assign(ring.style, { left: r.x + "px", top: r.y + "px", width: r.w + "px", height: r.h + "px" });
      tiles.push({ ring });
    } else tiles.push({ ...r, pc: r.pc_gdp, sp: false });
  }
  const sp = p.divisions[9];
  const show = (t, el) => {
    box.querySelectorAll(".tile.on").forEach(x => x.classList.remove("on"));
    el.classList.add("on");
    const parent = t.sp ? `<span class="small">Protection sociale · ${pct(sp.pc_gdp)} · ${money(sp.mio_eur)}</span>` : "";
    detailEl.innerHTML = `${parent}<span class="k">${t.label}</span><div class="row"><span class="num">${pct(t.pc, t.approx)}</span><span class="num">${money(t.mio_eur)}</span><span class="num">${fr1.format(100 * t.part_du_total)} % de la dépense totale</span></div>`;
  };
  let first = null;
  for (const t of tiles) {
    if (t.ring) { box.appendChild(t.ring); continue; }
    const el = document.createElement("div");
    el.className = "tile" + (t.sp ? " sp" : "");
    el.tabIndex = 0;
    el.setAttribute("role", "button");
    el.setAttribute("aria-label", `${t.label} : ${pct(t.pc, t.approx)}, ${money(t.mio_eur)}`);
    const bg = css(COLORS[t.code]);
    Object.assign(el.style, { left: t.x + GAP + "px", top: t.y + GAP + "px", width: Math.max(0, t.w - 2 * GAP) + "px", height: Math.max(0, t.h - 2 * GAP) + "px", background: bg, color: inkFor(bg) });
    const w = t.w, h = t.h;
    if (w > 62 && h > 30) el.innerHTML = `<b>${t.label}</b>` + (h > 46 ? `<span class="v">${fr1.format(t.pc)} %${t.approx ? "≈" : ""} · ${money(t.mio_eur)}</span>` : "");
    else if (w > 34 && h > 18) el.innerHTML = `<span class="v">${fr1.format(t.pc)}</span>`;
    el.addEventListener("mouseenter", () => show(t, el));
    el.addEventListener("focus", () => show(t, el));
    el.addEventListener("click", () => show(t, el));
    box.appendChild(el);
    if (!first) first = [t, el];
  }
  if (first) show(...first);
}

function profileCard(container, p, opts = {}) {
  container.innerHTML = `
    <div class="headline"><span class="big num">${fr1.format(p.total.pc_gdp)}&nbsp;%</span><span class="unit">du PIB en dépenses publiques${opts.hideName ? "" : ` · ${money(p.total.mio_eur)}`}</span></div>
    ${opts.hideName ? `<span class="eyebrow">Pays mystère · 2024</span>` : `<span class="eyebrow">${p.nom} · 2024${p.provisoire ? " · provisoire" : ""}</span>`}
    <div class="tm" role="group" aria-label="Répartition des dépenses publiques par fonction"></div>
    <div class="detail" aria-live="polite"></div>
    <p class="legend-note">Surface = part dans la dépense totale. Nuances de bleu, encadrées : protection sociale détaillée. Touchez un rectangle pour le détail.</p>
    ${opts.note ? `<p class="note${opts.noteWarn ? " warn" : ""}">${opts.note}</p>` : ""}`;
  const box = container.querySelector(".tm"), det = container.querySelector(".detail");
  const go = () => drawTreemap(box, p, det);
  go();
  new ResizeObserver(go).observe(box);
}



// Comparabilité : notes affichées en fin de partie (voir docs/comparabilite.md)
const NOTES = {
  CH: "La santé publique paraît très faible : l'assurance-maladie obligatoire suisse est probablement gérée hors des administrations publiques (hypothèse non confirmée par une source officielle).",
  IE: "Le ratio au PIB est bas en partie parce que le PIB irlandais est gonflé par les multinationales.",
};
const ARROW = { N: 0, NE: 45, E: 90, SE: 135, S: 180, SW: 225, W: 270, NW: 315 };
const $ = (id) => document.getElementById(id);

// Partie du jour, ou partie choisie par l'adresse (#partie12) pour revoir une partie passée
const forced = /^#partie(\d+)$/.exec(location.hash);
const today = localDay();
let n = forced ? +forced[1] : dayNumber(today, CAL);
if (n != null && (n < 1 || n > CAL.pays.length)) n = null;
const KEY = `budgetle-v1-${n}`;
const index = buildIndex(PROFILES);
let guesses = [];

function load() { try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch { return []; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(guesses.map(g => g.geo))); } catch {} }

function rowHtml(g, i) {
  const p = BY[g.geo];
  if (g.distance === 0) return `<div class="g win"><span class="c">${i + 1}. ${p.nom}</span><span class="r num">0 km</span><span aria-label="trouvé">🎉</span><span class="r num">100 %</span></div>`;
  return `<div class="g"><span class="c">${i + 1}. ${p.nom}</span><span class="r num">${fr0.format(g.distance / 1000)} km</span>
    <svg class="arrow" viewBox="0 0 24 24" role="img" aria-label="direction ${g.direction}" style="transform:rotate(${ARROW[g.direction]}deg)"><path d="M12 3l6 8h-4v10h-4V11H6z" fill="currentColor"/></svg>
    <span class="r num">${g.proximity} %</span></div>`;
}

function render(target) {
  const slots = [];
  for (let i = 0; i < MAX_TRIES; i++) slots.push(guesses[i] ? rowHtml(guesses[i], i) : `<div class="g empty" aria-hidden="true"></div>`);
  $("slots").innerHTML = slots.join("");
  const st = status(guesses);
  const done = st !== "playing";
  $("guess").disabled = $("go").disabled = done;
  $("form").hidden = done;
  if (!done) return;
  const text = shareText(n, guesses, SITE_URL);
  const lines = facts(target.geo, PROFILES).map(f => `<li>${f}</li>`).join("");
  const note = NOTES[target.geo] ? `<p class="note warn">${NOTES[target.geo]}</p>` : "";
  const prov = target.provisoire ? `<p class="small">Les chiffres 2024 de ce pays sont provisoires (Eurostat).</p>` : "";
  $("end").hidden = false;
  $("end").innerHTML = `
    <span class="eyebrow">${st === "won" ? `Trouvé en ${guesses.length} essai${guesses.length > 1 ? "s" : ""}` : "Perdu"}</span>
    <h2>${target.nom}</h2>
    <p>Dépense publique : ${fr1.format(target.total.pc_gdp)} % du PIB, soit ${money(target.total.mio_eur)} en 2024.</p>
    <ul>${lines}</ul>${note}${prov}
    <div class="share"><label for="sharetxt" class="small">Votre résultat</label>
      <textarea id="sharetxt" rows="${guesses.length + 4}" readonly>${text}</textarea>
      <button type="button" id="copy">Copier le résultat</button></div>
    <a class="btn" href="regles.html">Comprendre les données</a>`;
  $("copy").addEventListener("click", async () => {
    const ta = $("sharetxt");
    try { await navigator.clipboard.writeText(text); $("copy").textContent = "Copié"; }
    catch { ta.focus(); ta.select(); $("copy").textContent = "Texte sélectionné : copiez-le"; }
  });
}

// Suggestions accessibles au clavier
let options = [], active = -1;
function showSugg() {
  const exclude = guesses.map(g => g.geo);
  options = suggest($("guess").value, PROFILES, exclude);
  active = -1;
  const ul = $("sugg");
  ul.innerHTML = options.map((p, i) => `<li role="option" id="opt${i}" data-geo="${p.geo}" aria-selected="false">${p.nom}</li>`).join("");
  ul.hidden = !options.length;
  $("guess").setAttribute("aria-expanded", String(!!options.length));
}
function hideSugg() { $("sugg").hidden = true; $("guess").setAttribute("aria-expanded", "false"); active = -1; }
function setActive(i) {
  active = (i + options.length) % options.length;
  [...$("sugg").children].forEach((li, j) => li.setAttribute("aria-selected", String(j === active)));
  $("guess").setAttribute("aria-activedescendant", "opt" + active);
}

function submit(target, value) {
  const geo = findCountry(value, index);
  if (!geo) { $("msg").textContent = "Pays inconnu : choisissez un des 30 pays proposés (UE, Islande, Norvège, Suisse)."; return; }
  if (guesses.some(g => g.geo === geo)) { $("msg").textContent = `${BY[geo].nom} a déjà été proposé.`; return; }
  $("msg").textContent = "";
  guesses.push(evaluate(BY[geo], target, DMAX));
  save();
  $("guess").value = "";
  hideSugg();
  render(target);
  if (status(guesses) !== "playing") $("end").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
}

function start() {
  if (n == null) {
    $("mystery").innerHTML = `<p>Pas de partie à cette date. Le calendrier de la version bêta couvre du 16/10/2026 au 10/10/2027.</p>`;
    $("form").hidden = true;
    return;
  }
  const target = BY[CAL.pays[n - 1]];
  $("num").textContent = `Partie n° ${n}`;
  if (forced) { $("banner").hidden = false; $("banner").textContent = `Partie n° ${n} ouverte directement depuis l'adresse de la page.`; }
  profileCard($("mystery"), target, { hideName: true });
  guesses = load().filter(g => BY[g]).slice(0, MAX_TRIES).map(g => evaluate(BY[g], target, DMAX));
  render(target);
  $("guess").addEventListener("input", showSugg);
  $("guess").addEventListener("keydown", (e) => {
    if ($("sugg").hidden) return;
    if (e.key === "ArrowDown") { e.preventDefault(); setActive(active + 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setActive(active - 1); }
    else if (e.key === "Escape") hideSugg();
    else if (e.key === "Enter" && active >= 0) { e.preventDefault(); submit(target, options[active].nom); }
  });
  $("guess").addEventListener("blur", () => setTimeout(hideSugg, 150));
  $("sugg").addEventListener("pointerdown", (e) => { const li = e.target.closest("li"); if (li) { e.preventDefault(); submit(target, BY[li.dataset.geo].nom); } });
  $("form").addEventListener("submit", (e) => { e.preventDefault(); submit(target, $("guess").value); });
}
