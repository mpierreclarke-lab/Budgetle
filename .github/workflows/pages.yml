# Publie le site sur GitHub Pages à chaque envoi sur main, après vérification.
# Sécurité : actions épinglées par empreinte de commit (mises à jour proposées par Dependabot),
# droits minimaux du jeton, identifiants Git non conservés après la récupération du dépôt.
name: Publier le site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verifier-et-publier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "20" }
      - name: Reconstruire les pages
        run: python3 scripts/05_build_site.py
      - name: Vérifier que les pages publiées correspondent au dépôt
        run: git diff --exit-code site/dist
      - name: Contrôles des données et de la logique de jeu
        run: |
          node scripts/05_check_site.mjs
          node scripts/07_test_game.mjs
      - name: Contrôles de sécurité
        run: python3 scripts/12_check_security.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: { path: site/dist }
      - id: deploiement
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
