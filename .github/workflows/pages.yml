# Publie le site sur GitHub Pages à chaque envoi sur main, après vérification.
name: Publier le site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verifier-et-publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Reconstruire les pages
        run: python3 scripts/05_build_site.py
      - name: Vérifier que les pages publiées correspondent au dépôt
        run: git diff --exit-code site/dist
      - name: Contrôles des données et de la logique de jeu
        run: |
          node scripts/05_check_site.mjs
          node scripts/07_test_game.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site/dist }
      - id: deploiement
        uses: actions/deploy-pages@v4
